name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: checkboxes
    id: licensing
    attributes:
      label: Does this involve adding linguistic data?
      options:
        - label: This would add sign data, notation or corpora, and I have read the licensing section of CONTRIBUTING.md.
          required: false
