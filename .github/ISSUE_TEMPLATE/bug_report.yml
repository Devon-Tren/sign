name: Bug report
description: Something in the app is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with ./start.sh
        2. Go to the Phrase library
        3. ...
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Classroom / live interpretation
        - 3D avatar rendering
        - Phrase library
        - Learning studio / webcam tutor
        - Backend API
        - Setup / install
        - Not sure
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 140, macOS 15
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Browser devtools console, or the terminal output. Please redact any API keys.
      render: shell
